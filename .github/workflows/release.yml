name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# One release at a time, in merge order. Thus the newest merge is always the
# latest release. A queued release that a newer merge replaces does not run.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set the release version
        id: version
        run: |
          base=$(sed -n 's/.*config\/version="\([^"]*\)".*/\1/p' project.godot)
          if ! printf '%s\n' "$base" | grep -Eq '^[0-9]+(\.[0-9]+)+$'; then
            echo "The base version in project.godot is not a dotted number."
            exit 1
          fi
          version="${base}.${GITHUB_RUN_NUMBER}"
          sed -i "s/config\/version=\"[^\"]*\"/config\/version=\"${version}\"/" project.godot
          grep -q "config/version=\"${version}\"" project.godot
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Release version ${version}"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl unzip zip ca-certificates \
            libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 \
            libgl1 libfontconfig1 libxext6 libxrender1

      - name: Install Godot 4.7.1 and export templates
        run: |
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -fsSL -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          godot --version

      - name: Import and test
        run: |
          godot --headless --path . --import --quit
          python tools/check_pr.py --self-test
          python tools/check_update_scripts.py
          python tools/test_update_scripts.py --require-pwsh
          python tools/run_godot.py --timeout 300 -- godot --headless --path . --script res://tests/load_all_scripts.gd
          python tools/run_godot.py --timeout 300 -- godot --headless --path . res://tests/test_progression.tscn -- --no-update
          python tools/run_godot.py --timeout 220 -- godot --headless --path . res://tests/smoke_match.tscn -- dustline tdm 20

      - name: Export Windows, macOS, and Linux
        run: sh tools/export_all.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists. Replace its packages."
            gh release upload "$tag" GunFare-windows.zip GunFare-linux.zip GunFare-macos.zip --clobber
            exit 0
          fi
          gh release create "$tag" \
            GunFare-windows.zip \
            GunFare-linux.zip \
            GunFare-macos.zip \
            --target "${GITHUB_SHA}" \
            --title "$tag" \
            --latest \
            --notes "GunFare ${version} has Windows, macOS, and Linux packages. Extract the zip file to a folder before you start the game. A release build can then install a newer package from the main menu."
