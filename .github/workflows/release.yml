name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set the release version
        id: version
        run: |
          base=$(sed -n 's/.*config\/version="\([^"]*\)".*/\1/p' project.godot)
          if ! printf '%s\n' "$base" | grep -Eq '^[0-9]+(\.[0-9]+)+$'; then
            echo "The base version in project.godot is not a dotted number."
            exit 1
          fi
          version="${base}.${GITHUB_RUN_NUMBER}"
          sed -i "s/config\/version=\"[^\"]*\"/config\/version=\"${version}\"/" project.godot
          grep -q "config/version=\"${version}\"" project.godot
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Release version ${version}"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl unzip zip ca-certificates \
            libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 \
            libgl1 libfontconfig1 libxext6 libxrender1

      - name: Install Godot 4.7.1 and export templates
        run: |
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -fsSL -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          godot --version

      - name: Import and test
        run: |
          godot --headless --path . --import --quit
          python tools/check_pr.py --self-test
          python tools/check_update_scripts.py
          godot --headless --path . res://tests/test_progression.tscn -- --no-update
          godot --headless --path . res://tests/smoke_match.tscn -- dustline tdm 20

      - name: Export Windows, macOS, and Linux
        run: |
          mkdir -p build/windows build/linux build/macos
          godot --headless --path . --export-release "Windows" build/windows/GunFare.exe
          godot --headless --path . --export-release "Linux" build/linux/GunFare.x86_64
          godot --headless --path . --export-release "macOS" build/macos/GunFare.app
          test -f build/windows/GunFare.exe
          test -f build/linux/GunFare.x86_64
          test -d build/macos/GunFare.app
          (cd build/windows && zip -r ../../GunFare-windows.zip .)
          (cd build/linux && zip -r ../../GunFare-linux.zip .)
          (cd build/macos && zip -r -y ../../GunFare-macos.zip GunFare.app)
          unzip -l GunFare-windows.zip | grep -q 'GunFare.exe'
          unzip -l GunFare-linux.zip | grep -q 'GunFare.x86_64'
          unzip -l GunFare-macos.zip | grep -q 'GunFare.app'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v${version}"
          gh release create "$tag" \
            GunFare-windows.zip \
            GunFare-linux.zip \
            GunFare-macos.zip \
            --target "${GITHUB_SHA}" \
            --title "$tag" \
            --notes "GunFare ${version} has Windows, macOS, and Linux packages. A release build can install this package from the main menu."
